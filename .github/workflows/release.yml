name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: pydocfix-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-wheels:
    name: Build Linux wheel (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: manylinux2014-x86_64
            target: x86_64
            manylinux: "2014"
          - label: manylinux2014-aarch64
            target: aarch64
            manylinux: "2014"
          - label: musllinux-x86_64
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pydocfix-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  native-wheels:
    name: Build native wheel (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-x86_64
            os: macos-13
            target: x86_64
          - label: macos-aarch64
            os: macos-14
            target: aarch64
          - label: windows-x64
            os: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pydocfix-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, linux-wheels, native-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/pydocfix/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: pydocfix-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
