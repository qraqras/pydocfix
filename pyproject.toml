[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pydocsync"
version = "0.1.0b2"
description = "A Rust-powered Python signature-docstring synchronizer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ryuma Asai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ryumasai/pydocsync"
Repository = "https://github.com/ryumasai/pydocsync"
Issues = "https://github.com/ryumasai/pydocsync/issues"
Changelog = "https://github.com/ryumasai/pydocsync/releases"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pydoclint>=0.8.3",
    "ruff>=0.11",
    "pre-commit>=4.5.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-include = ["tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/pydocsync-cli/Cargo.toml"
strip = true

[tool.pydocsync]
exclude = ["tests/**/fixtures/"]
