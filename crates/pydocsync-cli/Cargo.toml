[package]
name = "pydocsync-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Command line interface for pydocsync"

[[bin]]
name = "pydocsync"
path = "src/main.rs"

[dependencies]
globset = "0.4"
pydocsync-core = { path = "../pydocsync-core" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
